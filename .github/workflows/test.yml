name: Test

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # No dependencies to install: CVForge uses only Node built-ins and
      # the Chrome that ships with GitHub's Ubuntu runners.
      - run: npm test
      - run: node bin/cvforge.mjs build examples/resume.json --theme noir -f pdf,png -o dist
      - uses: actions/upload-artifact@v4
        if: matrix.node == 24
        with:
          name: example-cv
          path: dist/
